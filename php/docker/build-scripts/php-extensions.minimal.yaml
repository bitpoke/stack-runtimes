- name: pdo
- name: "bcmath"
- name: "exif"
- name: "gd"
  build:
    args:
      - "--with-jpeg=/usr/include/"
      - "--with-webp=/usr/include/"
      - "--with-freetype=/usr/include/"
    depends:
      - libjpeg62-turbo-dev
      - libpng-dev
      - libwebp-dev
      - libfreetype6-dev
- name: imap
  phpMaxVersion: 8.3
  build:
    depends:
      - "libc-client-dev"
      - "libkrb5-dev"
      - "libssl-dev"
    args:
      - "--with-kerberos"
      - "--with-imap-ssl"
- name: intl
  build:
    depends:
      - "libicu-dev"
      - "zlib1g-dev"
- name: gettext
- name: mysqli
- name: pdo_mysql
- name: opcache
  # Since PHP 8.5, opcache is built-in and cannot be disabled. This extension is only needed for PHP 8.4 and below.
  phpMaxVersion: 8.4
- name: pcntl
- name: shmop
- name: simplexml
- name: soap
- name: xsl
  build:
    depends:
      - "libxslt-dev"
- name: zip
  build:
    depends:
      - "libzip-dev"
      - "zlib1g-dev"

#
# PECL extensions
#

# Install mcrypt for backward compatibility
- name: mcrypt
  phpMaxVersion: 8.2
  version: 1.0.9
  type: pecl
  build:
    depends:
      - "libmcrypt-dev"

# install apcu before serializers so that they detect and enable support for it
- name: apcu
  type: pecl
  version: 5.1.28
  priority: 30

# install serializers to make them available for the rest of the extensions
- name: igbinary
  type: pecl
  version: 3.2.16

- name: imap
  phpMinVersion: 8.4
  type: pecl
  version: 1.0.3
  build:
    depends:
      - "libc-client-dev"
      - "libkrb5-dev"
      - "libssl-dev"
    args:
      - "--with-kerberos"
      - "--with-imap-ssl"

- name: msgpack
  type: pecl
  version: 3.0.1

- name: zstd
  type: pecl
  version: 0.17.0
  build:
    depends:
      - "libzstd-dev"

- name: mailparse
  type: pecl
  version: 3.2.0

- name: memcache
  type: pecl
  version: 8.2
  build:
    depends:
      - "zlib1g-dev"

- name: memcached
  type: pecl
  version: 3.4.0
  build:
    depends:
      - "libmemcached-dev"
      - "zlib1g-dev"
    args:
      - "--enable-memcached-igbinary"
      - "--enable-memcached-msgpack"
      - "--enable-memcached-json"

- name: imagick
  type: pecl
  version: 3.8.1
  build:
    depends:
      - "libmagickwand-dev"

- name: redis
  type: pecl
  version: 6.3.0
  build:
    args:
      - "--enable-redis-igbinary"
      - "--enable-redis-msgpack"
      - "--enable-redis-lzf"
      - "--enable-redis-zstd"
